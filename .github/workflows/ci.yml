name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Required for github/codeql-action/upload-sarif to annotate PRs
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint PR commits
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run lint:js
      - run: bun run lint:biome
      - run: bun run lint:actions
      - run: bun run format
      - run: bun run spell
      - run: bun run just:check

  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep history so `--changed-since` and snapshot diffs can reach base
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Cache fallow binary
        id: fallow-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/fallow
          key: fallow-cli-2.28.2

      - name: Install fallow
        if: steps.fallow-cache.outputs.cache-hit != 'true'
        run: cargo install fallow-cli --version 2.28.2 --locked

      - run: bun install --frozen-lockfile

      - name: Fallow — default analysis (dead-code + dupes + health)
        run: fallow --group-by directory --score --sarif-file fallow.sarif

      - name: Fallow — production mode (strict dep hygiene)
        run: bun run analyze:production

      - name: Save health snapshot (master only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: fallow --score --save-snapshot --quiet

      - name: Upload SARIF
        if: always() && hashFiles('fallow.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fallow.sarif
          category: fallow

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose docs README.md
          fail: true

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --bun playwright install chromium --with-deps
      - run: bun run test:a11y

  # Reports every advisory but only fails on what this change introduces, and
  # only for ecosystems whose scanners prove reachability. JavaScript has no
  # such scanner, so here it reports and never blocks.
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is scanned from a worktree, so the history has to be real.
          fetch-depth: 0
      - uses: Xevion/advisory-action@master
